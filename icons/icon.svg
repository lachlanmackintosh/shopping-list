<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Grocery bag">
  <rect width="512" height="512" fill="#F3EBDD"/>

  <!-- baguette, lower end tucked into the bag -->
  <g transform="rotate(-28 400 170)">
    <rect x="352" y="62" width="64" height="188" rx="32" fill="#C47A3E"/>
    <rect x="374" y="70" width="24" height="172" rx="12" fill="#E6C48A"/>
    <path d="M368 108l32 18" stroke="#8A4E2C" stroke-width="7" stroke-linecap="round"/>
    <path d="M366 140l34 18" stroke="#8A4E2C" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- carrot: short fronds, long orange root -->
  <g>
    <path fill="#3E4C32" d="M292 168c-4-26 8-46 18-54 0 20-2 38-8 54z"/>
    <path fill="#526242" d="M310 164c6-28 22-46 34-52-6 20-14 38-22 52z"/>
    <path fill="#6A7B54" d="M304 170c10-22 28-34 40-36-10 14-22 26-32 36z"/>
    <path fill="#E08A34" d="M286 162c18 8 52 10 70 0 2 28-4 78-10 112h-48c-8-34-16-84-12-112z"/>
  </g>

  <!-- apple -->
  <circle cx="200" cy="186" r="50" fill="#C15C3E"/>
  <ellipse cx="184" cy="172" rx="14" ry="10" fill="#D87858"/>
  <path d="M200 138v-18" stroke="#6E4C34" stroke-width="7" stroke-linecap="round"/>
  <path fill="#526242" d="M200 126c16-18 36-8 30 8-12 0-22-2-30-8z"/>

  <!-- tall rectangular kraft bag with a zig-zag folded top -->
  <path fill="#D2B48A" d="
    M116 268
    L158 150
    L210 268
    L256 142
    L302 268
    L354 150
    L396 268
    V424
    Q396 452 368 452
    H144
    Q116 452 116 424
    Z"/>

  <!-- side gussets -->
  <path fill="#B48958" d="M116 268H172V424Q172 452 144 452Q116 452 116 424Z"/>
  <path fill="#A67C4C" d="M340 268H396V424Q396 452 368 452H340Z"/>

  <!-- flat bottom fold -->
  <path fill="#C49A68" d="M144 392H368V424Q368 452 340 452H172Q144 452 144 424Z"/>

  <!-- center crease -->
  <rect x="248" y="268" width="16" height="150" rx="8" fill="#C4A278"/>
</svg>
